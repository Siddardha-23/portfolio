name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.6.0"
  PROJECT_NAME: portfolio

jobs:
  # ===========================================================================
  # Detect Changes
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      shared-layer: ${{ steps.filter.outputs.shared-layer }}
      any-backend: ${{ steps.resolve.outputs.any-backend }}
      services-matrix: ${{ steps.resolve.outputs.services-matrix }}
      is-manual: ${{ steps.resolve.outputs.is-manual }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'portfolio-frontend/**'
            shared-layer:
              - 'portfolio-backend/shared/**'
            backend-visitor:
              - 'portfolio-backend/services/visitor/**'
            backend-auth:
              - 'portfolio-backend/services/auth/**'
            backend-jobs-resume:
              - 'portfolio-backend/services/jobs-resume/**'
            backend-chat:
              - 'portfolio-backend/services/chat/**'
            backend-infra:
              - 'portfolio-backend/services/infra/**'

      - name: Resolve deployment targets
        id: resolve
        run: |
          IS_MANUAL=${{ github.event_name == 'workflow_dispatch' }}
          echo "is-manual=${IS_MANUAL}" >> $GITHUB_OUTPUT

          LAYER=${{ steps.filter.outputs.shared-layer }}

          # Build the services list. If shared layer changed OR manual trigger, include all services.
          SERVICES=()
          # Important: deploy-layer republishes the shared layer when `any-backend == true`.
          # To prevent layer-version mismatches, we must update ALL backend services
          # whenever ANY backend service changes (or when shared-layer changes / manual).
          ANY_BACKEND=false
          if [ "${{ steps.filter.outputs.backend-visitor }}" = "true" ] ||
             [ "${{ steps.filter.outputs.backend-auth }}" = "true" ] ||
             [ "${{ steps.filter.outputs.backend-jobs-resume }}" = "true" ] ||
             [ "${{ steps.filter.outputs.backend-chat }}" = "true" ] ||
             [ "${{ steps.filter.outputs.backend-infra }}" = "true" ]; then
            ANY_BACKEND=true
          fi

          if [ "$IS_MANUAL" = "true" ] || [ "$LAYER" = "true" ] || [ "$ANY_BACKEND" = "true" ]; then
            SERVICES=("visitor" "auth" "jobs-resume" "chat" "infra")
          else
            [ "${{ steps.filter.outputs.backend-visitor }}" = "true" ] && SERVICES+=("visitor")
            [ "${{ steps.filter.outputs.backend-auth }}" = "true" ] && SERVICES+=("auth")
            [ "${{ steps.filter.outputs.backend-jobs-resume }}" = "true" ] && SERVICES+=("jobs-resume")
            [ "${{ steps.filter.outputs.backend-chat }}" = "true" ] && SERVICES+=("chat")
            [ "${{ steps.filter.outputs.backend-infra }}" = "true" ] && SERVICES+=("infra")
          fi

          if [ ${#SERVICES[@]} -gt 0 ]; then
            echo "any-backend=true" >> $GITHUB_OUTPUT
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -sc .)
            echo "services-matrix=${JSON}" >> $GITHUB_OUTPUT
          else
            echo "any-backend=false" >> $GITHUB_OUTPUT
            echo "services-matrix=[]" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Frontend Build & Deploy
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.is-manual == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: portfolio-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create production environment file
        run: |
          echo "VITE_API_URL=https://${{ secrets.DOMAIN_NAME }}/api" > .env.production

      - name: Record build start time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Build frontend
        run: npm run build

      - name: Compute build artifact hash
        id: artifact_hash
        run: |
          HASH=$(find dist -type f -print0 | sort -z | xargs -0 cat | sha256sum | awk '{print $1}')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" \
            --exclude "*.json"

          # Upload index.html and JSON with no-cache for instant updates
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          # Upload JSON files without aggressive caching
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.json" \
            --cache-control "public, max-age=60"

      - name: Invalidate CloudFront cache
        id: cf_invalidation
        run: |
          INVALIDATION_OUTPUT=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" 2>&1)
          echo "status=completed" >> $GITHUB_OUTPUT
          echo "$INVALIDATION_OUTPUT"

      - name: Generate deploy manifest
        run: |
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' | head -c 120 | sed 's/"/\\"/g')
          cat > deploy-manifest.json << EOF
          {
            "commit_sha": "${{ github.sha }}",
            "commit_short": "$(echo ${{ github.sha }} | cut -c1-7)",
            "commit_message": "${COMMIT_MSG}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "repository": "${{ github.repository }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "build_duration_seconds": ${BUILD_DURATION},
            "environment": "production",
            "deployer": "github-actions",
            "frontend_status": "deployed",
            "cloudfront_invalidation": "${{ steps.cf_invalidation.outputs.status }}",
            "artifact_hash": "sha256:${{ steps.artifact_hash.outputs.hash }}"
          }
          EOF

      - name: Upload deploy manifest to S3
        run: |
          aws s3 cp deploy-manifest.json s3://${{ secrets.S3_BUCKET_NAME }}/deploy-manifest.json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

  # ===========================================================================
  # Shared Lambda Layer Deploy
  # ===========================================================================
  deploy-layer:
    name: Deploy Shared Layer
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.is-manual == 'true' ||
      needs.detect-changes.outputs.any-backend == 'true'
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
    defaults:
      run:
        working-directory: portfolio-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build shared layer
        run: |
          # Install common dependencies into the layer
          pip install -r shared/requirements.txt -t shared/python/lib/python3.12/site-packages/

          # Remove packages already in Lambda runtime
          rm -rf shared/python/lib/python3.12/site-packages/boto3* \
                 shared/python/lib/python3.12/site-packages/botocore* \
                 shared/python/lib/python3.12/site-packages/s3transfer*

          # Strip bloat
          find shared/python -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find shared/python -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find shared/python -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find shared/python -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find shared/python -type f -name "*.pyc" -delete 2>/dev/null || true

          # Package the layer
          cd shared
          zip -r9 ../shared-layer.zip python/
          ls -lh ../shared-layer.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Lambda Layer
        id: publish
        run: |
          LAYER_OUTPUT=$(aws lambda publish-layer-version \
            --layer-name "${{ env.PROJECT_NAME }}-shared" \
            --zip-file fileb://shared-layer.zip \
            --compatible-runtimes python3.12 \
            --description "Shared utils, models, and common dependencies")

          LAYER_ARN=$(echo "$LAYER_OUTPUT" | jq -r '.LayerVersionArn')
          echo "layer_arn=${LAYER_ARN}" >> $GITHUB_OUTPUT
          echo "Published layer: ${LAYER_ARN}"

  # ===========================================================================
  # Backend Smoke Test
  # ===========================================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.is-manual == 'true' ||
      needs.detect-changes.outputs.any-backend == 'true'
    defaults:
      run:
        working-directory: portfolio-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shared dependencies
        run: pip install -r shared/requirements.txt

      - name: Smoke test changed services
        run: |
          # Make shared code importable
          export PYTHONPATH="${PWD}/shared/python:${PYTHONPATH}"

          if [ "${{ needs.detect-changes.outputs.is-manual }}" = "true" ]; then
            SERVICES="visitor auth jobs-resume chat infra"
          else
            SERVICES=$(echo '${{ needs.detect-changes.outputs.services-matrix }}' | jq -r '.[]')
          fi

          for service in ${SERVICES}; do
            echo "Testing ${service} service..."

            # Install service-specific deps if requirements.txt has content
            if [ -s "services/${service}/requirements.txt" ]; then
              pip install -r "services/${service}/requirements.txt" 2>/dev/null || true
            fi

            cd "services/${service}"
            python -c "from app import create_app; app = create_app(); print('${service}: OK')"
            cd ../..
          done

  # ===========================================================================
  # Backend Services Deploy (matrix)
  # ===========================================================================
  deploy-services:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, deploy-layer]
    if: >-
      needs.detect-changes.outputs.is-manual == 'true' ||
      needs.detect-changes.outputs.any-backend == 'true'
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services-matrix) }}
      fail-fast: false
    defaults:
      run:
        working-directory: portfolio-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: portfolio-backend/services/${{ matrix.service }}/requirements.txt

      - name: Build service package
        run: |
          SERVICE_DIR="services/${{ matrix.service }}"
          PACKAGE_DIR="package"
          mkdir -p "${PACKAGE_DIR}"

          # Install service-specific dependencies (if any)
          if [ -s "${SERVICE_DIR}/requirements.txt" ]; then
            pip install -r "${SERVICE_DIR}/requirements.txt" -t "${PACKAGE_DIR}"
          fi

          # Remove packages in Lambda runtime or shared layer
          rm -rf ${PACKAGE_DIR}/boto3* ${PACKAGE_DIR}/botocore* ${PACKAGE_DIR}/s3transfer* \
                 ${PACKAGE_DIR}/flask* ${PACKAGE_DIR}/Flask* ${PACKAGE_DIR}/pymongo* \
                 ${PACKAGE_DIR}/bcrypt* ${PACKAGE_DIR}/requests* ${PACKAGE_DIR}/urllib3* \
                 ${PACKAGE_DIR}/ua_parser* ${PACKAGE_DIR}/dnspython* ${PACKAGE_DIR}/dns* \
                 ${PACKAGE_DIR}/dotenv* ${PACKAGE_DIR}/python_dotenv* \
                 ${PACKAGE_DIR}/apig_wsgi* ${PACKAGE_DIR}/jwt* ${PACKAGE_DIR}/flask_jwt* \
                 ${PACKAGE_DIR}/flask_cors* ${PACKAGE_DIR}/werkzeug* ${PACKAGE_DIR}/jinja2* \
                 ${PACKAGE_DIR}/markupsafe* ${PACKAGE_DIR}/itsdangerous* ${PACKAGE_DIR}/click* \
                 ${PACKAGE_DIR}/blinker* ${PACKAGE_DIR}/certifi* ${PACKAGE_DIR}/charset_normalizer* \
                 ${PACKAGE_DIR}/idna*

          # Strip bloat
          find ${PACKAGE_DIR} -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find ${PACKAGE_DIR} -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find ${PACKAGE_DIR} -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find ${PACKAGE_DIR} -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find ${PACKAGE_DIR} -type f -name "*.pyc" -delete 2>/dev/null || true

          # Copy service application code
          cp "${SERVICE_DIR}/app.py" "${PACKAGE_DIR}/"
          cp "${SERVICE_DIR}/lambda_handler.py" "${PACKAGE_DIR}/"
          [ -d "${SERVICE_DIR}/blueprints" ] && cp -r "${SERVICE_DIR}/blueprints" "${PACKAGE_DIR}/"
          [ -d "${SERVICE_DIR}/services" ] && cp -r "${SERVICE_DIR}/services" "${PACKAGE_DIR}/"
          [ -d "${SERVICE_DIR}/schemas" ] && cp -r "${SERVICE_DIR}/schemas" "${PACKAGE_DIR}/"
          [ -d "${SERVICE_DIR}/agents" ] && cp -r "${SERVICE_DIR}/agents" "${PACKAGE_DIR}/"
          [ -d "${SERVICE_DIR}/tools" ] && cp -r "${SERVICE_DIR}/tools" "${PACKAGE_DIR}/"
          # Top-level service modules (e.g. chat's cloud_diary.py, knowledge_base.py)
          for mod in cloud_diary.py knowledge_base.py; do
            [ -f "${SERVICE_DIR}/${mod}" ] && cp "${SERVICE_DIR}/${mod}" "${PACKAGE_DIR}/"
          done

          # Create deployment zip
          cd "${PACKAGE_DIR}"
          zip -r9 ../lambda-${{ matrix.service }}.zip .
          ls -lh ../lambda-${{ matrix.service }}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda Layer reference
        run: |
          FUNCTION_NAME="${{ env.PROJECT_NAME }}-${{ matrix.service }}"
          LAYER_ARN="${{ needs.deploy-layer.outputs.layer_arn }}"
          aws lambda update-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --layers "${LAYER_ARN}" \
            --no-cli-pager
          aws lambda wait function-updated --function-name "${FUNCTION_NAME}"

      - name: Deploy to Lambda
        run: |
          FUNCTION_NAME="${{ env.PROJECT_NAME }}-${{ matrix.service }}"
          ZIP_FILE="lambda-${{ matrix.service }}.zip"
          ZIP_SIZE=$(stat -c%s "${ZIP_FILE}")
          MAX_DIRECT=50000000  # 50MB

          if [ "$ZIP_SIZE" -gt "$MAX_DIRECT" ]; then
            echo "Package is $(( ZIP_SIZE / 1048576 ))MB - deploying via S3"
            S3_KEY="lambda-deploy/${ZIP_FILE}-${{ github.sha }}"
            aws s3 cp "${ZIP_FILE}" "s3://${{ secrets.S3_BUCKET_NAME }}/${S3_KEY}"
            aws lambda update-function-code \
              --function-name "${FUNCTION_NAME}" \
              --s3-bucket "${{ secrets.S3_BUCKET_NAME }}" \
              --s3-key "${S3_KEY}" \
              --publish
            aws s3 rm "s3://${{ secrets.S3_BUCKET_NAME }}/${S3_KEY}"
          else
            echo "Package is $(( ZIP_SIZE / 1048576 ))MB - deploying directly"
            aws lambda update-function-code \
              --function-name "${FUNCTION_NAME}" \
              --zip-file "fileb://${ZIP_FILE}" \
              --publish
          fi

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ env.PROJECT_NAME }}-${{ matrix.service }}"

  # ===========================================================================
  # Post-Deployment Verification
  # ===========================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-frontend, deploy-services]
    if: always() && !cancelled()
    steps:
      - name: Test health endpoint
        if: >-
          needs.deploy-services.result == 'success' ||
          needs.deploy-frontend.result == 'success'
        run: |
          curl -f https://${{ secrets.DOMAIN_NAME }}/api/health || echo "Health check pending..."

      - name: Generate summary
        run: |
          FRONTEND_STATUS="${{ needs.deploy-frontend.result }}"
          BACKEND_STATUS="${{ needs.deploy-services.result }}"

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${FRONTEND_STATUS}" = "skipped" ]; then
            echo "| Frontend | Skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
          elif [ "${FRONTEND_STATUS}" = "success" ]; then
            echo "| Frontend | Deployed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend | Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${BACKEND_STATUS}" = "skipped" ]; then
            echo "| Backend Services | Skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
          elif [ "${BACKEND_STATUS}" = "success" ]; then
            echo "| Backend Services | Deployed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Backend Services | Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Website**: https://${{ secrets.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Health**: https://${{ secrets.DOMAIN_NAME }}/api/health" >> $GITHUB_STEP_SUMMARY
